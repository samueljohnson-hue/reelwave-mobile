name: Build Reelwave AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Connect Reelwave to production AI backend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text()
          old = "backendUrl.value=localStorage.getItem('reelwaveBackend')||'';"
          new = "backendUrl.value='https://reelwave-mobile.vercel.app';backendUrl.readOnly=true;"
          if old not in s:
              raise SystemExit('Could not find backend URL initialization')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Reelwave-AI-v6-connected.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reelwave-AI-v6-Connected-APK
          path: apk-output/Reelwave-AI-v6-connected.apk
          if-no-files-found: error
