name: Build Reelwave AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --include=optional
      - name: Add expanded sky library
        run: python scripts/add-more-skies.py
      - name: Add audio reactive sky movement
        run: python scripts/add-audio-reactive-skies.py
      - name: Add Brat lyric styles
        run: python scripts/add-brat-lyric-styles.py
      - name: Apply 30 to 50 second clip selector
        run: python scripts/add-30-50-clip-selector.py
      - name: Add manual lyric sync
        run: python scripts/add-manual-lyrics-sync.py
      - name: Fix interactive controls and playback syntax
        run: python scripts/fix-v12-ui.py
      - name: Syntax-check generated app JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('www/index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')
          b=s.rfind('</script>')
          if a < 0 or b < 0 or b <= a:
              raise SystemExit('Could not locate embedded app script')
          Path('/tmp/reelwave-app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/reelwave-app.js
      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Reelwave-AI-v14-startup-fix.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reelwave-AI-v14-Startup-Fix-APK
          path: apk-output/Reelwave-AI-v14-startup-fix.apk
          if-no-files-found: error
